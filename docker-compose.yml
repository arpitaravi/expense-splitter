x-backend: &backend
  build: ./backend
  environment: &env
    POSTGRES_DB: splitter
    POSTGRES_USER: splitter
    POSTGRES_PASSWORD: splitter
    POSTGRES_HOST: db
    REDIS_URL: redis://redis:6379/0
    DEBUG: "1"
    CELERY_ENABLED: "1"
  depends_on: [db, redis]

services:
  db:
    image: postgres:16
    environment: { POSTGRES_DB: splitter, POSTGRES_USER: splitter, POSTGRES_PASSWORD: splitter }
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7
  api:
    <<: *backend
    ports: ["8000:8000"]
  worker:
    <<: *backend
    command: celery -A config worker -l info
  beat:
    <<: *backend
    command: celery -A config beat -l info
  web:
    build: ./frontend
    ports: ["5173:80"]

volumes:
  pgdata:
